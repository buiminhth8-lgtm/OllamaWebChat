<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RK3588 智能平台能力演示</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/demo.css') }}">
  <script defer src="{{ url_for('static', filename='vendor/echarts.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/demo/timeline.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/demo/chip-demo.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/demo/llm-demo.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/demo/cluster-demo.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/demo/vision-demo.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/demo/driver-demo.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/demo/stability-demo.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/demo/main.js') }}"></script>
</head>
<body>
<div class="app demo-app">
  <header class="demo-header">
    <h1>RK3588 智能平台能力演示</h1>
    <nav class="top-nav" aria-label="页面导航">
      <a href="/">AI 对话</a>
      <a class="active" href="/demo">平台能力演示</a>
    </nav>
    <span class="demo-mode">模拟演示模式 · Demo Mode</span>
  </header>

  <main class="demo-main">
    <section class="demo-warning">
      <strong>模拟数据 · 虚拟演示 · Demo Mode</strong>
      <span>当前页面全部为模拟数据，仅用于方案展示，不代表真实设备检测结果。</span>
    </section>

    <section class="cockpit">
      <div class="status-grid" id="platformStatus"></div>
      <div class="score-panel">
        <h2>总体能力评分 <span>模拟数据</span></h2>
        <div id="scoreChart" class="score-chart">
          <canvas id="scoreFallback" width="360" height="260"></canvas>
        </div>
      </div>
    </section>

    <section class="control-panel">
      <div class="controls">
        <button id="startDemo" class="primary" type="button">开始演示</button>
        <button id="pauseDemo" class="secondary" type="button">暂停演示</button>
        <button id="resetDemo" class="secondary" type="button">重新演示</button>
        <button id="exportReport" class="secondary" type="button">导出演示报告</button>
      </div>
      <div class="mode-controls" aria-label="演示模式">
        <label><input type="radio" name="playMode" value="auto" checked> 自动演示</label>
        <label><input type="radio" name="playMode" value="manual"> 手动演示</label>
        <label><input id="lowPowerMode" type="checkbox"> 低性能模式</label>
      </div>
    </section>

    <section class="steps" id="stepNav"></section>

    <section class="demo-layout">
      <section class="stage-card">
        <div class="stage-head">
          <div>
            <span class="eyebrow">虚拟演示</span>
            <h2 id="stageTitle">等待开始</h2>
          </div>
          <span class="demo-badge">Demo Data</span>
        </div>
        <div id="stage" class="stage"></div>
      </section>

      <aside class="side-panel">
        <section class="data-panel">
          <h2>虚拟数据面板 <span>模拟数据</span></h2>
          <div id="dataPanel"></div>
        </section>
        <section class="event-panel">
          <h2>演示事件日志 <span>Demo Mode</span></h2>
          <ol id="eventLog"></ol>
        </section>
      </aside>
    </section>

    <footer class="demo-disclaimer">
      本页面全部数据、设备状态、性能指标、任务状态和识别结果均为虚拟生成，仅用于方案展示，不代表真实RK3588设备、无人机、飞控、NPU或模型运行结果。
    </footer>
  </main>
</div>
</body>
</html>
