<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ollama Web Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
<!--
  首页区域基线（UI-Slice 0）：
  page
  ├── #pageHeader        顶部：标题、导航、模型工具栏、全局状态
  └── #chatMain          对话主区域
      ├── #messages      对话消息流
      └── #composerBar   输入区（Chat 表单）

  约定：所有现有 DOM ID 是 JS 的稳定性契约，后续 UI 重构移动元素时必须保留。
  Ollama 管理与模型下载均位于 Settings Drawer，主页仅保留 Chat 与模型选择。
-->
<div class="app" id="page">
  <!-- 区域：header（UI-Slice 1：精简导航，仅 Logo/主导航/模型选择/设置入口） -->
  <header id="pageHeader">
    <div class="brand" id="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Ollama Web Chat</h1>
    </div>
    <nav class="top-nav" id="topNav" aria-label="页面导航">
      <a class="active" href="/">AI 对话</a>
      <a href="/platform">平台能力检测</a>
      <a href="/demo">平台能力演示</a>
    </nav>
    <div class="toolbar" id="modelToolbar">
      <select id="modelSelect" aria-label="选择模型" title="选择模型">
        <option value="">正在加载模型...</option>
      </select>
      <button
        id="settingsButton"
        class="icon-button"
        type="button"
        title="设置"
        aria-label="设置"
        aria-controls="settingsDrawer"
        aria-expanded="false"
      >⚙</button>
    </div>
    <!-- 清空对话已迁移至 Composer 次级操作区（UI-Slice 3） -->
    <!-- 全局状态提示：仅在有内容时以浮动条显示，不再常驻 Header -->
    <span id="status" role="status" aria-live="polite"></span>
  </header>

  <!-- 区域：chat-main -->
  <div class="chat-main" id="chatMain">
    <!-- 子区域：消息流（含 Welcome 空状态） -->
    <main id="messages">
      <div id="chatWelcome" class="chat-welcome">
        <div class="welcome-logo" aria-hidden="true"></div>
        <h2>你好，我是 Ollama</h2>
        <p>本地大模型助手，隐私、快速、可定制。</p>
        <div class="welcome-cards" id="welcomeCards">
          <button type="button" class="welcome-card" data-prompt="帮我解释一下量子计算的基本原理，并举例说明它的应用场景。">
            <strong>知识问答</strong>
            <span>询问各类知识问题，获取准确回答</span>
          </button>
          <button type="button" class="welcome-card" data-prompt="请帮我编写一个 Python 函数，判断一个字符串是否是回文，并逐行解释代码。">
            <strong>代码助手</strong>
            <span>编写、解释和优化各类代码</span>
          </button>
          <button type="button" class="welcome-card" data-prompt="以“未来的城市”为主题，写一篇 300 字左右的短文。">
            <strong>创作助手</strong>
            <span>撰写文章、故事、文案与创意内容</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 子区域：输入区（UI-Slice 3：紧凑 Composer，发送/停止为单一主操作位） -->
    <footer id="composerBar">
      <form id="chatForm" class="composer">
        <textarea
          id="prompt"
          rows="1"
          aria-label="输入消息"
          placeholder="输入消息。Enter 发送，Shift+Enter 换行。"
          required
        ></textarea>
        <div class="composer-actions">
          <div class="composer-secondary">
            <button id="clearChat" class="ghost-button" type="button">清空对话</button>
          </div>
          <div class="composer-primary">
            <button id="sendButton" class="primary" type="submit" disabled>发送</button>
            <button id="stopButton" class="stop-button" type="button" hidden disabled>停止</button>
          </div>
        </div>
        <div class="hint">对话记录保存在当前浏览器中，过长历史会自动裁剪后发送给 Ollama。</div>
      </form>
    </footer>
  </div>
</div>

<!-- UI-Slice 6：Ollama 管理与模型下载均位于 Drawer。 -->
<div id="settingsOverlay" class="settings-overlay" aria-hidden="true"></div>
<aside
  id="settingsDrawer"
  class="settings-drawer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="settingsDrawerTitle"
  aria-hidden="true"
>
  <header class="settings-drawer-header">
    <h2 id="settingsDrawerTitle">配置中心</h2>
    <button
      id="settingsCloseButton"
      class="settings-close-button"
      type="button"
      aria-label="关闭配置中心"
    >×</button>
  </header>
  <div class="settings-drawer-content">
    <section class="settings-section settings-ollama-section" aria-labelledby="settingsOllamaHeading">
      <div class="settings-section-heading">
        <h3 id="settingsOllamaHeading">Ollama 服务</h3>
        <span id="ollamaServiceStatus" class="ollama-status is-neutral" aria-live="polite">
          <span class="ollama-status-dot" aria-hidden="true"></span>
          <span id="ollamaStatusText">正在检测...</span>
        </span>
      </div>
      <dl class="ollama-details" id="ollamaDetails" aria-label="Ollama 服务详情">
        <div class="ollama-detail-row">
          <dt>服务状态</dt>
          <dd id="ollamaServiceState">unknown</dd>
        </div>
        <div class="ollama-detail-row">
          <dt>版本</dt>
          <dd id="ollamaVersion">—</dd>
        </div>
      </dl>
      <form id="ollamaConfigForm" class="ollama-config-form">
        <label for="ollamaInstallDir">安装目录</label>
        <div class="ollama-config-controls">
          <input
            id="ollamaInstallDir"
            name="install_dir"
            type="text"
            placeholder="/home/lvi/ollama-server/bin"
            autocomplete="off"
          >
          <button id="saveOllamaConfig" class="primary" type="submit">保存</button>
        </div>
      </form>
      <div class="ollama-actions" id="ollamaActions">
        <button id="refreshOllamaStatus" class="secondary" type="button">刷新状态</button>
        <button id="startOllama" class="primary" type="button" disabled>启动 Ollama</button>
      </div>
      <p id="ollamaMessage" class="ollama-message" role="status" aria-live="polite"></p>
    </section>
    <section
      class="settings-section settings-model-section"
      id="modelPullPanel"
      aria-labelledby="settingsModelsHeading"
    >
      <h3 id="settingsModelsHeading">模型管理</h3>
      <form id="modelPullForm" class="model-pull-form">
        <label for="pullModelName">下载模型</label>
        <div class="ollama-config-controls">
          <input
            id="pullModelName"
            name="model"
            type="text"
            placeholder="deepseek-r1:1.5b"
            autocomplete="off"
          >
          <button id="pullModelButton" class="primary" type="submit">下载</button>
        </div>
      </form>
      <div id="modelPullProgress" class="model-pull-progress" hidden>
        <span class="model-pull-status-label">下载状态</span>
        <div class="model-pull-progress-row">
          <span id="pullStatusText" role="status" aria-live="polite"></span>
          <span id="pullProgressText"></span>
        </div>
        <div class="progress-bar" role="presentation">
          <div id="pullProgressBarFill" class="progress-bar-fill"></div>
        </div>
      </div>
    </section>
  </div>
</aside>
</body>
</html>
