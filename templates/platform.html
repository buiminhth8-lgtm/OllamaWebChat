<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RK3588 平台能力检测</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/platform.css') }}">
  <script defer src="{{ url_for('static', filename='js/platform.js') }}"></script>
</head>
<body>
<div class="app platform-app">
  <header>
    <h1>RK3588 平台能力检测</h1>
    <nav class="top-nav" aria-label="页面导航">
      <a href="/">AI 对话</a>
      <a class="active" href="/platform">平台能力检测</a>
    </nav>
    <span id="scanStatus">未扫描</span>
  </header>

  <main class="platform-main">
    <section class="summary-panel">
      <div class="summary-grid">
        <div><span>设备名称</span><strong id="deviceName">未知</strong></div>
        <div><span>芯片型号</span><strong id="socName">未知</strong></div>
        <div><span>CPU 架构</span><strong id="cpuArch">未知</strong></div>
        <div><span>操作系统</span><strong id="osName">未知</strong></div>
        <div><span>内核版本</span><strong id="kernelVersion">未知</strong></div>
        <div><span>运行时间</span><strong id="uptimeValue">未知</strong></div>
        <div><span>扫描状态</span><strong id="summaryStatus">未扫描</strong></div>
        <div><span>最后扫描时间</span><strong id="lastScanTime">暂无</strong></div>
      </div>
      <div class="actions">
        <button id="startScan" class="primary" type="button">开始扫描</button>
        <button id="rescan" class="secondary" type="button">重新扫描</button>
        <button id="exportJson" class="secondary" type="button" disabled>导出 JSON</button>
      </div>
      <div class="progress-area">
        <div class="progress-meta">
          <span id="currentStep">等待扫描</span>
          <span id="progressText">0 / 6</span>
        </div>
        <div class="progress-bar" aria-hidden="true"><span id="progressFill"></span></div>
      </div>
    </section>

    <section id="cards" class="cards" aria-live="polite"></section>
  </main>
</div>
</body>
</html>
